name: run-tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, develop ]

jobs:
  run-tests:
    permissions:
      contents: read
    # Public fork verification stays GitHub-hosted.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      redis:
        image: redis
        ports:
          - 6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
      mysql:
        image: mysql:latest
        env:
          MYSQL_DATABASE: mixpost_test
          MYSQL_USER: user
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    strategy:
      fail-fast: false
      matrix:
        php: [ 8.2, 8.3 ]
        laravel: [ ^10.47, ^11.0, ^12.0 ]

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, mysql, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, redis
          coverage: none

      - name: Set Laravel version
        run: |
          sed -i 's/^10.47|^11.0|^12.0/${{ matrix.laravel }}/g' composer.json

      - name: Install composer dependencies
        uses: ramsey/composer-install@v2
        env:
          COMPOSER_ROOT_VERSION: dev-main

        with:
          composer-options: "--prefer-dist --no-interaction"

      - name: Execute tests
        run: composer test
        env:
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          DB_PORT: ${{ job.services.mysql.ports['3306'] }}
          DB_DATABASE: mixpost_test
          DB_USERNAME: user
          DB_PASSWORD: secret
