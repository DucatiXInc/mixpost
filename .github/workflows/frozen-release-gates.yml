name: Frozen release guard
on:
  workflow_dispatch:
  push:
    paths: ['ops/**', 'docs/customizations/**', '.github/workflows/frozen-release-gates.yml']
  pull_request:
    paths: ['ops/**', 'docs/customizations/**', '.github/workflows/frozen-release-gates.yml']
jobs:
  release-guard:
    permissions:
      contents: read
    # Preserve hosted execution for this public upstream fork.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify release gate cannot accept missing tests or stale source/assets
        run: |
          bash -n ops/production-overrides/peachy-start.sh
          php ops/production-overrides/tests/TwitterAnalyticsCadenceTest.php
          python3 ops/scripts/check-customization-register.py
          python3 ops/production-overrides/tests/CustomizationRegisterTest.py
          python3 ops/production-overrides/tests/FrozenUploadReleaseGateTest.py
          python3 ops/production-overrides/tests/BlueskyPatchApplicationTest.py
          python3 ops/production-overrides/tests/TwitterMediaPatchApplicationTest.py
# The licensed Pro behavior suites run on the release host against the exact
# frozen candidate, not this repository's Lite package. CI does not waive them.
